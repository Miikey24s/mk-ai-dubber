[project]
name = "vi-dubber"
version = "0.1.0"
description = "High-quality local English-to-Vietnamese AI dubbing pipeline"
requires-python = ">=3.12,<3.13"
dependencies = [
  "audio-separator[cpu]>=0.44.2,<0.48",
  "audioread>=3.0.0",
  "gradio>=6.17,<7",
  "numpy>=2.1,<3",
  "PyYAML>=6.0.2,<7",
  "rapidfuzz>=3.14,<4",
  "requests>=2.32,<3",
  "rich>=14,<15",
  "soundfile>=0.13,<0.14",
  "torch==2.8.0",
  "torchaudio==2.8.0",
  "torchcodec>=0.6,<0.8",
  "torchvision==0.23.0",
  "typer>=0.16,<1",
  "vieneu>=3.7.1,<4",
  "whisperx>=3.8,<3.9",
  "yt-dlp>=2025.1",
]

[project.scripts]
vi-dubber = "vi_dubber.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vi_dubber"]

[tool.uv]
package = true

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch" }
torchaudio = { index = "pytorch" }
torchvision = { index = "pytorch" }

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=8.4,<9",
    "pytest-playwright>=0.9.0",
]
